<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlasmaLTP RAG</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>PlasmaLTP RAG</h1>
            <p class="subtitle">Retrieval-Augmented Generation System</p>
        </header>

        <main>
            <div class="query-section">
                <div class="input-group">
                    <label for="questionInput">Question</label>
                    <textarea 
                        id="questionInput" 
                        placeholder="Enter your question here..."
                        rows="4"
                    ></textarea>
                </div>
                <button id="askBtn" class="btn-primary">Ask</button>
            </div>

            <div id="loadingIndicator" class="loading hidden">
                <div class="spinner"></div>
                <p>Processing your question...</p>
            </div>

            <div id="responseSection" class="response-section hidden">
                <h2>Answer</h2>
                <div id="answerContent" class="answer-content markdown-body"></div>
                
                <div id="evidenceSection" class="evidence-section">
                    <h3>Evidence</h3>
                    <div id="evidenceList" class="evidence-list"></div>
                </div>
            </div>

            <div id="errorSection" class="error-section hidden">
                <h2>Error</h2>
                <div id="errorContent" class="error-content"></div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
